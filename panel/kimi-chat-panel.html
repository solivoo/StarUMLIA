<div id="kimi-chat-panel" class="kimi-chat-panel bottom-panel vert-resizable top-resizer no-focus">
  <div class="toolbar">
    <div class="title">Kimi Diagrams</div>
    <a href="#" class="kimi-clear" title="Limpiar chat">Clear</a>
    <a href="#" class="close" style="background: none">
      <span class="k-icon k-i-close"></span>
    </a>
  </div>
  <div class="panel-content resizable-content kimi-body">
    <div class="kimi-messages" id="kimi-messages"></div>
    <div class="kimi-input-row">
      <textarea id="kimi-input" rows="3" placeholder="Ej: Crea un diagrama DDD de un e-commerce con Pedido, Cliente, Producto..."></textarea>
      <button type="button" id="kimi-send" class="k-button k-primary">Generar</button>
    </div>
    <div class="kimi-hint">Preferences → Kimi AI (API Key). La respuesta JSON se convierte en diagrama de clases.</div>
  </div>
</div>
